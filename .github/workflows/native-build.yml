name: Build Android and Windows installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/native/**', 'scripts/native/**', 'public/mirkam/**', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: apps/native
      - run: npm run windows
        working-directory: apps/native
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installed Windows shell opens without a server
        run: '$result = Start-Process -FilePath "apps/native/release/win-unpacked/Mirkam Line.exe" -ArgumentList "--mirkam-smoke" -Wait -PassThru; exit $result.ExitCode'
      - name: Verify signed UI update loads inside the Windows application
        run: |
          $bundle = (Resolve-Path "updates/windows.json").Path
          $result = Start-Process -FilePath "apps/native/release/win-unpacked/Mirkam Line.exe" -ArgumentList @("--mirkam-update-smoke", "--update-bundle=$bundle") -Wait -PassThru
          exit $result.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: Mirkam-Line-Windows-test-installer
          path: apps/native/release/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm install --no-audit --no-fund
        working-directory: apps/native
      - run: npm run android:add
        working-directory: apps/native
      - run: npx esbuild android-bridge.js --bundle --format=iife --outfile=www/native-bridge.js && npx cap sync android
        working-directory: apps/native
      - run: python -m pip install Pillow && python scripts/native/android-icons.py
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease --no-daemon
        working-directory: apps/native/android
      - name: Collect unsigned APK and signing verifier for private local release signing
        run: |
          mkdir -p apps/native/release/android
          cp apps/native/android/app/build/outputs/apk/release/app-release-unsigned.apk apps/native/release/android/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apps/native/release/android/
      - uses: actions/upload-artifact@v4
        with:
          name: Mirkam-Line-Android-signing-input
          path: apps/native/release/android/*
          if-no-files-found: error
