name: Build Android and Windows installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/native/**', 'scripts/native/**', 'public/mirkam/**', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: apps/native
      - run: npm run windows
        working-directory: apps/native
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Mirkam-Line-Windows-test-installer
          path: apps/native/release/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
        working-directory: apps/native
      - run: npm run android:add
        working-directory: apps/native
      - run: npx esbuild android-bridge.js --bundle --format=iife --outfile=www/native-bridge.js && npx cap sync android
        working-directory: apps/native
      - run: python -m pip install Pillow && python scripts/native/android-icons.py
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: apps/native/android
      - uses: actions/upload-artifact@v4
        with:
          name: Mirkam-Line-Android-test-apk
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
