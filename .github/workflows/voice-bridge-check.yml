name: Voice bridge build and streaming API
on:
  push:
    branches: [main]
    paths:
      - 'integrations/voice-elements/**'
      - 'experiments/voice-streaming-linux/**'
      - '.github/workflows/voice-bridge-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile production bridge
        run: dotnet publish integrations/voice-elements/Bridge.csproj -c Release -o /tmp/mirkam-bridge
      - name: Verify digit interruption and PIN timeouts without calls
        run: dotnet /tmp/mirkam-bridge/Bridge.dll --input-self-test
      - name: Inspect public streaming API without credentials or calls
        run: dotnet /tmp/mirkam-bridge/Bridge.dll --streaming-api
      - name: Inspect all streaming native imports without initialization
        run: dotnet /tmp/mirkam-bridge/Bridge.dll --streaming-native-api
      - name: Check native streaming dependency on Linux without calls
        run: dotnet /tmp/mirkam-bridge/Bridge.dll --streaming-platform-check
      - name: Inspect SDK socket dependencies without initialization
        run: dotnet /tmp/mirkam-bridge/Bridge.dll --streaming-socket-api
      - name: Build experimental Linux clock adapter
        run: gcc -Wall -Wextra -Werror -fPIC -shared experiments/voice-streaming-linux/clock-compat.c -o /tmp/libmirkam-clock.so
      - name: Probe SDK with synthetic loopback audio only
        # Exploratory, not a production capability assertion. Retain its outcome.
        continue-on-error: true
        timeout-minutes: 1
        run: timeout 15s dotnet /tmp/mirkam-bridge/Bridge.dll --streaming-loopback-check /tmp/libmirkam-clock.so
