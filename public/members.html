<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מרקם ליין — חשבון וטיוטות</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><p class="eyebrow">Mirkam Line · Mavrika AI</p><h1>החשבון והטיוטות שלכם</h1></header>
<p id="notice" role="status" aria-live="polite"></p>
<section id="login-panel"><h2>כניסה</h2><form id="login-form"><label for="code">קוד משתמש — שש ספרות</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="username"><label for="pin">קוד אישי — שש ספרות</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="current-password"><button>כניסה</button></form></section>
<section id="account-panel" hidden><h2 id="welcome"></h2><div class="actions"><button id="new-draft">עתירה חדשה</button><button id="refresh-drafts">הטיוטות והמסמכים שלי</button><button id="logout">יציאה</button></div><div id="draft-list"></div></section>
<section id="draft-panel" hidden><h2 id="question"></h2><div id="court-choices"></div><div id="answer-panel"><textarea id="answer" rows="6" aria-label="תשובה"></textarea><button id="submit-answer">בדיקת התשובה</button><button id="skip-answer">דילוג</button><button id="back-answer">חזרה</button></div><div id="confirm-panel"><p id="pending" class="pre"></p><button id="confirm-answer">נכון, שמירה והמשך</button><button id="retry-answer">תיקון</button></div><div id="review-panel"><pre id="document"></pre><select id="edit-field" aria-label="שדה לתיקון"></select><button id="edit-answer">תיקון שדה</button><button id="pdf">PDF</button><button id="docx">Word</button></div><p>תשובות שאושרו נשמרות בחשבון. המסמכים במסך זה מיועדים לבדיקה, לא להגשה.</p></section>
<details><summary>רישום משתמש — למנהל בלבד</summary><form id="enroll-form"><label for="admin-token">קוד ניהול</label><input id="admin-token" type="password" required autocomplete="off"><label for="name">שם</label><input id="name" required><label for="identity">מספר זהות</label><input id="identity" inputmode="numeric" pattern="[0-9]{9}" required><label for="prisoner-number">מספר אסיר</label><input id="prisoner-number" required><label for="prison">בית הסוהר</label><input id="prison" required><label for="wing">אגף</label><input id="wing"><label for="verified-by">מי אימת את הזכאות</label><input id="verified-by" required><button>יצירת חשבון מאומת</button></form><p id="credentials" role="status"></p></details>
<p><a href="/">ממשק הניהול ובדיקת החיבורים</a></p>
</main><script src="/members.js" defer></script></body></html>
